!DOCTYPE html>
<html lang="en">
<head>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('https://i.ibb.co/5G0JZ8j/yamen-bg.jpg') no-repeat center center fixed;
      background-size: cover;

    }
    header {
      text-align: center;

    .btn {
      background-color: #B388FF;
      color: #000;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    footer {
      text-align: center;
      padding: 20px;

      background: rgba(0,0,0,0.4);
