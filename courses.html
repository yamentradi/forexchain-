
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yamen Courses</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: url('https://raw.githubusercontent.com/yamentradi/forexchain-/main/bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
        }
        .container {
            padding: 20px;
        }

            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 10px;

        }

        }
        .course img {
            width: 100%;
            border-radius: 10px;
        }

</head>
<body>
    <div class="container">
        <h1>Welcome to Yamen Courses</h1>

        <div class="course">

        </div>

        <div class="course">
            <h2>Programming Course</h2>
            <img src="https://i.imgur.com/qAO1n1O.png" alt="Programming Course">
            <p>Master modern programming languages and build real projects.</p>
        </div>

        <div class="course">
            <h2>AI Trading Course</h2>
            <img src="https://i.imgur.com/y7PAiEG.png" alt="AI Trading Course">
            <p>Discover how artificial intelligence can boost your trading performance.</p>
        </div>
    </div>

</html>
