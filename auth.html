
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ForexChain - Authentication</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('https://raw.githubusercontent.com/yamen701/ForexChain/main/assets/yamen-bg.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
    }
    .overlay {
      background-color: rgba(0, 0, 0, 0.75);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
    }
    .tab-buttons {
      margin-bottom: 20px;
    }
    .tab-buttons button {
      padding: 10px 20px;
      margin: 0 5px;
      border: none;
      background: #00f5ff;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
    }
    .form-container {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 400px;
      display: none;
    }
    .form-container.active {
      display: block;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: none;
      background: #fff;
      color: #000;
    }
    button.submit {
      width: 100%;
      background: #00f5ff;
      color: #000;
      font-weight: bold;
    }
    .logout-msg {
      font-size: 1.2em;
      text-align: center;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="tab-buttons">
      <button onclick="showForm('login')">Login</button>
      <button onclick="showForm('register')">Register</button>
      <button onclick="showForm('logout')">Logout</button>
    </div>

    <div id="login" class="form-container active">
      <h2>Login</h2>
      <input type="email" placeholder="Email" required />
      <input type="password" placeholder="Password" required />
      <button class="submit">Login</button>
    </div>

    <div id="register" class="form-container">
      <h2>Register</h2>
      <input type="text" placeholder="Full Name" required />
      <input type="email" placeholder="Email" required />
      <input type="password" placeholder="Password" required />
      <button class="submit">Register</button>
    </div>

    <div id="logout" class="form-container">
      <h2>Logged Out</h2>
      <p class="logout-msg">You have been successfully logged out.</p>
      <button onclick="showForm('login')">Back to Login</button>
    </div>
  </div>

  <script>
    function showForm(formId) {
      document.querySelectorAll('.form-container').forEach(form => {
        form.classList.remove('active');
      });
      document.getElementById(formId).classList.add('active');
    }
  </script>
</body>
</html>
