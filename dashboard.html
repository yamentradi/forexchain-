
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForexChain Dashboard</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url('dashboard-bg.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
    }
    .overlay {
      background-color: rgba(0, 0, 0, 0.6);
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h1 {
      font-size: 48px;
    }
    p {
      font-size: 20px;
      margin: 10px 0;
    }
    .btn {
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #00b894;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn:hover {
      background-color: #019875;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <h1>Welcome to ForexChain</h1>
    <p>Control panel | Points | Courses | Withdrawals</p>
    <a href="courses.html" class="btn">View Courses</a>
  </div>
</body>
</html>
