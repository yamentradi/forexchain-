
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ForexChain Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: url('https://raw.githubusercontent.com/yamen701/ForexChain/main/assets/yamen-bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
        }
        .overlay {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 40px;
            min-height: 100vh;
        }
        .header {
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 40px;
        }
        .content {
            max-width: 800px;
            margin: auto;
        }
        .card {
            background-color: #222;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        .card h3 {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="header">Welcome to Your ForexChain Dashboard</div>
        <div class="content">
            <div class="card">
                <h3>Your Courses</h3>
                <p>Access your enrolled courses and track progress.</p>
            </div>
            <div class="card">
                <h3>Your Bits</h3>
                <p>View your earned points and available discounts.</p>
            </div>
            <div class="card">
                <h3>Support</h3>
                <p>If you need help, contact us on Telegram: <a href="https://t.me/memo2304" style="color: #00f5ff;">@memo2304</a></p>
            </div>
        </div>
    </div>
</body>
</html>
