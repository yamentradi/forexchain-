<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ForexChain Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0d1117;
      color: #fff;
      padding: 20px;
    }

    .dashboard-container {
      max-width: 500px;
      margin: auto;
      background-color: #161b22;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      text-align: center;
    }

    .balance, .trades {
      font-size: 20px;
      margin: 15px 0;
    }

    button {
      padding: 12px 25px;
      margin: 10px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background-color: #238636;
      color: white;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #2ea043;
    }

    .logout {
      background-color: #da3633;
    }

    .logout:hover {
      background-color: #f85149;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <h1>Welcome to ForexChain</h1>
    <p class="balance">Balance: <span id="balance">0 USD</span></p>
    <p class="trades">Trades Made: <span id="trades">0</span></p>

    <button onclick="makeTrade()">Make Trade</button>
    <button onclick="withdraw()">Withdraw</button>
    <br><br>
    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <script>
    // Check login
    if (!localStorage.getItem("loggedInUser")) {
      window.location.href = "login.html";
    }

    // Load balance and trades from localStorage
    let balance = parseFloat(localStorage.getItem("balance")) || 0;
    let trades = parseInt(localStorage.getItem("trades")) || 0;

    document.getElementById("balance").textContent = balance.toFixed(2) + " USD";
    document.getElementById("trades").textContent = trades;

    function makeTrade() {
      balance += Math.random() * 10;  // simulate profit
      trades += 1;
      localStorage.setItem("balance", balance);
      localStorage.setItem("trades", trades);
      document.getElementById("balance").textContent = balance.toFixed(2) + " USD";
      document.getElementById("trades").textContent = trades;
      alert("Trade executed successfully!");
    }

    function withdraw() {
      if (balance < 50) {
        alert("You need at least $50 to withdraw.");
        return;
      }
      balance -= 4.5; // Withdrawal fee
      localStorage.setItem("balance", balance);
      document.getElementById("balance").textContent = balance.toFixed(2) + " USD";
      alert("Withdrawal request sent! $4.5 fee deducted.");
    }

    function logout() {
      localStorage.removeItem("loggedInUser");
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
