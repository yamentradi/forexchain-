!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ForexChain</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #0f0c29, #302b63, #24243e);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 30px 20px 10px;
    }

    header img {
      width: 150px;
      height: auto;
    }

    h1 {
      margin-top: 10px;
      font-size: 28px;
    }

    .button {
      margin-top: 25px;
    }

    .button a {
      text-decoration: none;
    }

    .button button {
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 10px;
      background-color: #6c00ff;
      color: white;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .button button:hover {
      background-color: #4b00c2;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="ForexChain Logo">
    <h1>Welcome to ForexChain – Your Gateway to Smart Trading</h1>
    <div class="button">
      <a href="register.html">
        <button>Create Account</button>
      </a>
    </div>
  </header>
</body>
</html>
