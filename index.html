
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ForexChain</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      color: #2c3e50;
      font-size: 3em;
      margin-bottom: 0.5em;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 2em;
      color: #34495e;
    }

    .btn-container {
      display: flex;
      gap: 20px;
    }

    .btn {
      padding: 12px 24px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #2980b9;
      color: white;
      transition: background-color 0.3s ease;
      text-decoration: none;
    }

    .btn:hover {
      background-color: #1f6391;
    }
  </style>
</head>
<body>
  <h1>Welcome to ForexChain</h1>
  <p>Simple and powerful crypto & forex trading platform</p>
  <div class="btn-container">
    <a class="btn" href="#">Login</a>
    <a class="btn" href="#">Register</a>
  </div>
</body>
</html>
