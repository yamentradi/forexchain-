
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ForexChain</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(120deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 150px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      text-align: center;
      max-width: 500px;
    }

    .buttons {
      display: flex;
      gap: 20px;
    }

    .buttons a {
      padding: 12px 25px;
      border: 2px solid #fff;
      border-radius: 25px;
      text-decoration: none;
      color: #fff;
      transition: all 0.3s ease;
      font-weight: bold;
    }

    .buttons a:hover {
      background-color: #6a00ff;
      color: #fff;
      border-color: #6a00ff;
    }
  </style>
</head>
<body>
  <img src="logo.png" alt="ForexChain Logo" class="logo" />
  <h1>Welcome to ForexChain</h1>
  <p>The future of trading is here. Join the revolution with a secure, fast, and modern trading experience.</p>
  <div class="buttons">
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
  </div>
</body>
</html>
